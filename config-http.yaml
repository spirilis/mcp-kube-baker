# mcp-kube-baker example configuration — Streamable HTTP transport, with the
# optional extras: legacy MCP compatibility and GitHub OAuth (both off by
# default; uncomment to enable).
kubeconfig: /home/user/.kube/config

server:
  mode: http
  http:
    host: 127.0.0.1
    port: 8080
    # Requests with no Origin header (non-browser clients) are always allowed.
    # Empty allowed_origins permits only localhost origins; "*" allows any.
    #allowed_origins: ["*"]
    # This listener also answers GET /healthz and GET /readyz alongside /mcp,
    # for Kubernetes probes or a Docker HEALTHCHECK. Always on, no knob, and
    # unauthenticated even when auth is enabled below — a probe carries no
    # token, and neither response names a context or cluster.
  # Serve pre-2026-07-28 MCP clients (initialize handshake + sessions) too:
  #legacy_compat:
  #  enabled: true
  #  session_ttl: 30m

# GitHub OAuth for the HTTP transport. When enabled, tool/resource responses
# are marked cacheScope=private automatically.
#auth:
#  enabled: true
#  issuer: https://mcp.example.com
#  github:
#    clientId: "your-github-oauth-app-client-id"
#    clientSecret: "your-github-oauth-app-client-secret"
#  storage:
#    dbPath: /var/lib/mcp-kube-baker/oauth.db
#  allowlist:
#    users: ["your-github-login"]

# Experimental skills extension (SEP-2640). On by default; omitting this section
# means the same as enabled: true. Uncomment to hide the extension entirely —
# no capability key, and skills/list, skills/get and resources/directory/read
# all answer -32601. Plugins keep working either way, minus their skills.
#skills:
#  enabled: false

logging:
  level: info
  format: text
